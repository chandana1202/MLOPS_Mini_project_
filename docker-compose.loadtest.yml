services:
  llm-stub:
    build: .
    image: eia-stub
    command: uvicorn stub.main:app --host 0.0.0.0 --port 9000
    environment:
      STUB_DELAY_S: "1.5"

  worker:
    environment:
      LLM_PROVIDER: openai_compat
      LLM_BASE_URL: http://llm-stub:9000/v1
      LLM_API_KEY: stub
      LLM_MODEL: stub
    depends_on:
      - llm-stub

  locust:
    image: locustio/locust
    volumes: ["./loadtest:/mnt/locust"]
    depends_on:
      - api
    profiles: ["locust"]